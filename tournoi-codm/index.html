<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gewgui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : colonne d'application centrée (560px max), billets empilés, dock noir flottant en bas.
   Direction « Billet de match » : blanc, noir, jaune CODM, dégradés jaunes sur les billets en direct et les couvertures. */
:root {
  --bg: #ffffff;
  --soft: #f6f6f4;
  --line: #ececea;
  --line-strong: #dcdcd8;
  --fg: #0b0b0c;
  --muted: #6b6b70;
  --faint: #a1a1a6;
  --y: #ffc400;
  --y-soft: #fff5cc;
  --y-text: #8a6500;
  --live: #e5372f;
  --ok: #138a4b;
  --ok-soft: #e8f6ee;
  --ticket-yellow: linear-gradient(145deg, #ffd84d 0%, #ffc400 55%, #ffb800 100%);
  --cover: radial-gradient(130% 90% at 100% 0%, #ffe27a 0%, #ffc400 45%, #ffb300 100%);
  --font-display: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gut: max(20px, env(safe-area-inset-left, 0px));
  --gut-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -.035em; line-height: 1.05; margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }

.app { max-width: 560px; margin: 0 auto; padding: 14px var(--gut-r) 120px var(--gut); display: flex; flex-direction: column; gap: 18px; }
.app > * { min-width: 0; }

/* En-têtes */
.hello { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hello small { display: block; color: var(--muted); font-size: .8rem; }
.hello b { font: 600 1.05rem var(--font-display); letter-spacing: -.02em; }
.logo { display: flex; align-items: center; gap: 8px; font: 700 1.05rem var(--font-display); letter-spacing: -.03em; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--fg); color: var(--y); display: grid; place-items: center; font: 700 .85rem var(--font-display); font-style: normal; letter-spacing: 0; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--y); display: grid; place-items: center; font: 600 .8rem var(--font-display); border: 0; flex: none; }
.title { font-size: 2rem; letter-spacing: -.045em; }
.bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.bar-top .t { font: 600 .9rem var(--font-body); text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.circle { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; border: 0; flex: none; font-size: 1rem; }
.eyebrow { font-size: .78rem; color: var(--muted); }

/* Bande de dates */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 0; border-radius: 14px; padding: 8px 0 6px; text-align: center; background: var(--soft); font-size: .7rem; color: var(--muted); display: grid; justify-items: center; gap: 1px; }
.day b { font: 600 1.05rem var(--font-display); color: var(--fg); letter-spacing: -.02em; }
.day::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day.has::after { background: var(--y); }
.day.today b { text-decoration: underline; text-decoration-color: var(--y); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.day[aria-pressed="true"] { background: var(--fg); color: #bdbdbd; }
.day[aria-pressed="true"] b { color: #fff; }

/* Billets */
.tk { position: relative; border-radius: 22px; background: #fff; border: 1px solid var(--line); overflow: hidden; text-align: left; padding: 0; width: 100%; display: block; }
button.tk:hover { border-color: var(--line-strong); }
.tk .top { padding: 16px 18px 14px; }
.cut { position: relative; height: 0; border-top: 1.5px dashed var(--line-strong); margin: 0 14px; }
.cut::before, .cut::after { content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.cut::before { left: -26px; } .cut::after { right: -26px; }
.stub { padding: 12px 18px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tk.live { border: 0; background: var(--ticket-yellow); }
.tk.live .cut { border-color: rgb(0 0 0 / .25); }
.tk.live .cut::before, .tk.live .cut::after { border: 0; }
.big { font: 700 1.65rem/1.03 var(--font-display); letter-spacing: -.045em; margin-top: 12px; }
.mini { display: flex; gap: 18px; margin-top: 10px; font-size: .76rem; flex-wrap: wrap; }
.mini b { display: block; font: 600 .9rem var(--font-display); letter-spacing: -.01em; }
.lst { display: flex; align-items: stretch; }
.date { width: 68px; flex: none; display: grid; place-content: center; text-align: center; border-right: 1.5px dashed var(--line-strong); padding-block: 12px; }
.date b { font: 700 1.55rem/1 var(--font-display); letter-spacing: -.04em; }
.date span { font: 600 .66rem var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.lst .inf { padding: 12px 14px; flex: 1; min-width: 0; display: grid; gap: 2px; }
.lst h3 { font: 600 .98rem var(--font-display); letter-spacing: -.02em; }
.gauge { height: 4px; border-radius: 2px; background: var(--soft); margin-top: 6px; overflow: hidden; }
.gauge i { display: block; height: 100%; border-radius: 2px; background: var(--y); }
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec h2 { font: 600 1rem var(--font-display); letter-spacing: -.02em; }
.sec span { font: 500 .8rem var(--font-body); color: var(--muted); }

/* Pastilles */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 .72rem var(--font-body); padding: 4px 10px; border-radius: 99px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { background: var(--fg); color: #fff; } .pill.live::before { background: var(--y); animation: blink 1.4s infinite; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.wait { background: var(--y-soft); color: var(--y-text); }
.pill.no { background: #fdecea; color: var(--live); }
.pill.plain::before { display: none; }
.tag { font: 500 .68rem var(--font-data); padding: 2px 6px; border-radius: 5px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.rank1 { font: 700 .8rem var(--font-display); background: var(--y); padding: 3px 8px; border-radius: 7px; }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: #fff; color: var(--fg); padding: 9px 14px; border-radius: 99px; font: 600 .82rem var(--font-body); white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--line-strong); }
.btn.dark { background: var(--fg); color: #fff; border-color: var(--fg); }
.btn.red { color: var(--live); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.cta { width: 100%; border: 0; background: var(--fg); color: #fff; border-radius: 18px; padding: 15px; font: 600 .95rem var(--font-body); display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
.cta i { font-style: normal; color: var(--y); }
.cta.yellow { background: var(--y); color: var(--fg); } .cta.yellow i { color: var(--fg); }
.cta.ghost { background: var(--soft); color: var(--fg); } .cta.ghost i { color: var(--fg); }
.cta[disabled] { opacity: .35; cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { justify-content: space-between; }
.link { background: none; border: 0; padding: 0; font-weight: 600; color: var(--fg); text-decoration: underline; text-decoration-color: var(--y); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* Page tournoi */
.cover { margin: -14px calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut)); min-height: 240px; background: var(--cover); padding: 14px var(--gut-r) 44px var(--gut); display: flex; flex-direction: column; justify-content: space-between; gap: 30px; position: relative; overflow: hidden; }
.cover::after { content: ""; position: absolute; right: -60px; bottom: -90px; width: 260px; height: 260px; border-radius: 50%; border: 44px solid rgb(255 255 255 / .18); pointer-events: none; }
.cover .circle { background: rgb(255 255 255 / .65); position: relative; z-index: 1; }
.cover h1 { font-size: 2.1rem; letter-spacing: -.05em; margin-top: 10px; position: relative; z-index: 1; }
.cover .chip { font: 600 .74rem var(--font-body); background: rgb(255 255 255 / .72); padding: 4px 10px; border-radius: 99px; position: relative; z-index: 1; display: inline-flex; gap: 6px; align-items: center; }
.sheet { margin-top: -46px; z-index: 2; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.facts div { padding: 13px 4px; min-width: 0; }
.facts div + div { border-left: 1px solid var(--line); }
.facts b { display: block; font: 600 1rem var(--font-display); letter-spacing: -.02em; }
.facts span { font-size: .7rem; color: var(--muted); }
.kv small { display: block; font-size: .7rem; color: var(--muted); }
.kv b { font: 600 .95rem var(--font-display); letter-spacing: -.02em; }
.desc { color: var(--muted); font-size: .9rem; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 14px; overflow-x: auto; }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 10px; border-radius: 10px; font: 600 .8rem var(--font-body); color: var(--muted); white-space: nowrap; display: inline-flex; justify-content: center; align-items: center; gap: 5px; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
.tabs .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.panel { display: grid; gap: 16px; min-width: 0; }
.squads { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; }
.squads i { aspect-ratio: 1; border-radius: 3px; background: #efefec; max-width: 100%; }
.squads i.f { background: var(--fg); }
.squads i.w { background: var(--y); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font: 600 .72rem var(--font-body); background: var(--soft); border-radius: 99px; padding: 4px 10px; }
.chips span.y { background: var(--y-soft); color: var(--y-text); }
.empty { background: var(--soft); border-radius: 18px; padding: 28px 18px; text-align: center; display: grid; gap: 6px; justify-items: center; color: var(--muted); font-size: .88rem; }
.empty h3 { font: 600 1rem var(--font-display); color: var(--fg); letter-spacing: -.02em; }
.note { font-size: .8rem; color: var(--y-text); background: var(--y-soft); border-radius: 12px; padding: 9px 12px; }
.note:empty { display: none; }

details.team { border: 1px solid var(--line); border-radius: 16px; }
details.team summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
details.team summary::-webkit-details-marker { display: none; }
details.team .n { font: 600 .75rem var(--font-data); color: var(--faint); }
details.team .nm { font-weight: 600; font-size: .92rem; min-width: 0; overflow-wrap: anywhere; }
details.team .nm small { display: block; font-weight: 400; font-size: .74rem; color: var(--muted); }
details.team[open] summary { border-bottom: 1px solid var(--line); }
.roster { padding: 4px 14px 8px; }
.roster div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .85rem; }
.roster div:last-child { border-bottom: 0; }
.roster span:last-child { font: 500 .76rem var(--font-data); color: var(--muted); }
.roster .lbl-sub { font: 600 .66rem var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding-top: 12px; border-bottom: 0; }
.teams { display: grid; gap: 8px; }

ol.rules { margin: 0; padding: 0; list-style: none; counter-reset: r; }
ol.rules li { counter-increment: r; display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
ol.rules li:last-child { border-bottom: 0; }
ol.rules li::before { content: counter(r, decimal-leading-zero); font: 500 .74rem var(--font-data); color: var(--y-text); padding-top: 2px; }

.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--fg); overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.thumb { aspect-ratio: 16 / 9; max-width: 100%; width: 100%; border: 0; background: linear-gradient(135deg, #1b1b1e, #0b0b0c); position: relative; display: grid; place-items: center; overflow: hidden; }
.thumb::after { content: ""; position: absolute; right: -40px; bottom: -70px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgb(255 196 0 / .45), rgb(255 196 0 / 0) 65%); }
.play { width: 52px; height: 52px; border-radius: 50%; background: var(--y); display: grid; place-items: center; z-index: 1; }

/* Résultats */
.champ { border-radius: 24px; background: var(--fg); color: #fff; padding: 18px 20px; position: relative; overflow: hidden; }
.champ::before { content: ""; position: absolute; right: -40px; bottom: -90px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgb(255 196 0 / .55), rgb(255 196 0 / 0) 65%); }
.champ small { color: var(--y); font: 600 .7rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
.champ h3 { margin: 8px 0 2px; font-size: 1.75rem; letter-spacing: -.045em; }
.champ .sub { color: var(--faint); font-size: .8rem; }
.champ .pts { font: 600 2.8rem/1 var(--font-display); letter-spacing: -.05em; color: var(--y); margin-top: 12px; }
.champ .pts span { font-size: 1rem; color: #fff; }
.champ svg { position: relative; }
.mvp { display: flex; gap: 12px; align-items: center; background: var(--y-soft); border-radius: 18px; padding: 12px 14px; }
.mvp .b { background: var(--fg); color: var(--y); font: 700 .75rem var(--font-display); padding: 8px 10px; border-radius: 10px; }
.lb { display: grid; grid-template-columns: 24px 1fr auto 40px; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.lb .r { font: 600 .8rem var(--font-data); color: var(--muted); }
.lb .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.lb .k { font: 500 .74rem var(--font-data); color: var(--muted); white-space: nowrap; }
.lb .p { font: 600 .98rem var(--font-display); letter-spacing: -.02em; text-align: right; }
.lb.me { background: var(--y-soft); margin-inline: -10px; padding-inline: 10px; border-radius: 10px; }
.t1 { font: 600 .62rem var(--font-body); background: var(--y-soft); color: var(--y-text); padding: 2px 6px; border-radius: 5px; margin-left: 4px; white-space: nowrap; }
.more { background: none; border: 0; font: 600 .8rem var(--font-body); color: var(--muted); justify-self: center; }

/* Formulaires */
form { display: grid; gap: 14px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld label, .lbl { font: 500 .8rem var(--font-body); }
.hint { font-size: .74rem; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], input[type="password"], select, textarea {
  width: 100%; min-width: 0; background: #fff; border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px 14px; font-size: .92rem; transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--fg); box-shadow: 0 0 0 4px rgb(255 196 0 / .25); }
input.uid { font-family: var(--font-data); font-size: .85rem; }
.two { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.type { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.type b { font: 600 .95rem var(--font-display); letter-spacing: -.02em; }
.type span { font-size: .74rem; color: var(--muted); line-height: 1.35; }
.type .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--soft); display: grid; place-items: center; }
.type .ic svg { width: 18px; height: 18px; }
.type[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: linear-gradient(160deg, #fff7d1, #fff 70%); }
.type[aria-pressed="true"] .ic { background: var(--y); }
.prow { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 8px; align-items: center; }
.prow .n { width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font: 600 .7rem var(--font-data); }
.prow .n.c { background: var(--y); }
.prow input { padding: 10px 12px; border-radius: 12px; font-size: .86rem; }
.check { display: flex; gap: 10px; font-size: .82rem; align-items: flex-start; }
.check input { width: 18px; height: 18px; accent-color: var(--fg); margin: 1px 0 0; flex: none; }
.center { text-align: center; }
.demo { background: var(--soft); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.demo .row .btn { flex: 1 1 100px; }
.bareme { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.bareme label { display: grid; gap: 3px; font: 600 .7rem var(--font-body); color: var(--muted); }
.bareme input { padding: 9px 10px; border-radius: 12px; text-align: center; font: 600 .9rem var(--font-data); }
.bareme .kill input { background: var(--y-soft); border-color: #f0d36b; }
.add-place { border: 1px dashed var(--line-strong); background: none; border-radius: 12px; font: 600 .74rem var(--font-body); color: var(--muted); min-height: 40px; align-self: end; }

/* Mon clan */
.timeline { display: grid; }
.timeline div { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding-bottom: 12px; position: relative; font-size: .84rem; }
.timeline div::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); margin: 5px 0 0 4px; }
.timeline div::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.timeline div:last-child { padding-bottom: 0; } .timeline div:last-child::after { display: none; }
.timeline .d::before { background: var(--fg); }
.timeline .n::before { background: var(--y); box-shadow: 0 0 0 4px var(--y-soft); }
.timeline .x::before { background: var(--live); }
.timeline small { display: block; color: var(--muted); font-size: .74rem; }
.tk.live .timeline small { color: #5c4600; }

/* Organisateur */
.picker { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.picker button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 12px; font: 600 .78rem var(--font-body); color: var(--muted); }
.picker button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
.picker .add { border-style: dashed; color: var(--fg); }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi div { border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.kpi b { display: block; font: 700 1.4rem/1.1 var(--font-display); letter-spacing: -.04em; }
.kpi b small { font-size: .85rem; }
.kpi span { font-size: .7rem; color: var(--muted); }
.kpi .y { background: var(--ticket-yellow); border-color: transparent; }
.kpi .y span, .kpi .y small { color: #5c4600; }
.filt { display: flex; gap: 6px; flex-wrap: wrap; }
.filt button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 11px; font: 600 .76rem var(--font-body); color: var(--muted); }
.filt button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
.req { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; }
.req h3 { font: 600 .95rem var(--font-display); letter-spacing: -.02em; }
.req .pl { display: flex; gap: 5px; flex-wrap: wrap; }
.req .pl span { font: 500 .7rem var(--font-body); background: var(--soft); border-radius: 6px; padding: 3px 7px; }
.req .pl span.sub { background: none; border: 1px dashed var(--line-strong); }
.req .pl span.dup { background: var(--y-soft); color: var(--y-text); border: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1; border-radius: 12px; padding: 10px; }
.entry { display: grid; grid-template-columns: 1fr 64px 96px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .84rem; }
.entry .hd { font: 500 .66rem var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.entry .nm { min-width: 0; overflow-wrap: anywhere; }
.entry input { padding: 7px 4px; border-radius: 10px; text-align: center; font: 600 .84rem var(--font-data); }
.entry input.filled { background: var(--y-soft); border-color: #f0d36b; }
.entry input.bad { border-color: var(--live); background: #fdecea; }
.stp { display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; }
.stp button { width: 26px; height: 26px; border: 0; border-radius: 7px; background: var(--soft); font-weight: 600; }
.stp input { border: 0; padding: 0; width: 100%; background: none; box-shadow: none !important; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.setting b { font: 600 .92rem var(--font-display); letter-spacing: -.02em; display: block; }
.setting small { color: var(--muted); font-size: .76rem; }
.sw { width: 44px; height: 26px; border-radius: 99px; background: var(--line-strong); position: relative; border: 0; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] { background: var(--fg); }
.sw[aria-checked="true"]::after { left: 21px; background: var(--y); }
.sw[disabled] { opacity: .4; cursor: not-allowed; }

/* Dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: 6px; background: var(--fg); padding: 6px; border-radius: 24px; box-shadow: 0 14px 30px rgb(0 0 0 / .25); }
.dock button { width: 58px; height: 48px; border-radius: 18px; border: 0; background: none; display: grid; place-items: center; color: #8d8d92; }
.dock button[aria-current="page"] { background: var(--y); color: var(--fg); }
.dock svg { width: 21px; height: 21px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: #fff; padding: 11px 18px; border-radius: 99px; font: 500 .85rem var(--font-body); z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .2); text-align: center; }
.foot { margin-top: 10px; font-size: .74rem; color: var(--faint); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.foot button { background: none; border: 0; padding: 0; font: 600 .74rem var(--font-body); color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="dock" id="dock" aria-label="Navigation"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  const KEY = "gewgui-br-v1";
  const ROLES = { joueur: "Joueur", chef: "Chef de clan", orga: "Organisateur", invite: "Visiteur" };
  const STATUTS = {
    inscriptions: { label: "Inscriptions ouvertes", cls: "ok" },
    closes: { label: "Inscriptions closes", cls: "wait" },
    en_cours: { label: "En direct", cls: "live" },
    termine: { label: "Terminé", cls: "" }
  };
  const TEAM_STATUT = { en_attente: ["En attente", "wait"], validee: ["Validée", "ok"], refusee: ["Refusée", "no"] };
  const BAREME = [15, 12, 10, 8, 6, 4, 2, 1, 1, 1];
  const MONTHS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sep", "Oct", "Nov", "Déc"];

  /* ---------- Données d'exemple ---------- */
  const CLANS = [["Phantom Wolves", "PWV"], ["Ghost Unit", "GHU"], ["Black Mamba", "BMB"], ["Shadow Legion", "SHL"], ["Red Falcons", "RFC"], ["Night Raid", "NRD"], ["Iron Vipers", "IVP"], ["Storm Squad", "STS"], ["Desert Eagles", "DSE"], ["Silent Killers", "SLK"], ["Alpha Dogs", "ADG"], ["Venom Strike", "VNS"], ["Royal Snipers", "RSN"], ["Dark Order", "DKO"], ["Blaze Unit", "BLZ"], ["Cobra Kai", "CBK"], ["Titan Force", "TTF"], ["Lone Wolves", "LNW"], ["Savage Kings", "SVK"], ["Neon Riders", "NNR"], ["Frost Bite", "FRB"], ["Sky Hunters", "SKH"], ["Omega Squad", "OMG"], ["Thunder Hawks", "THK"], ["Kings Guard", "KGD"], ["Rogue Nation", "RGN"], ["Steel Panthers", "STP"], ["Viper Nest", "VPN"]];
  const NAMES = ["Kaizen", "Nova", "Rift", "Zekk", "Lynx", "Spectre", "Vex", "Kano", "Drift", "Venom", "Fang", "Sly", "Mojo", "Umbra", "Raze", "Onyx", "Kyro", "Blitz", "Talon", "Ember", "Hawk", "Pyro", "Owl", "Dusk", "Rook", "Mako", "Zero", "Steel", "Bolt", "Cobra", "Axe", "Thor", "Gale", "Volt", "Haze"];
  const RULES = [
    "Chaque équipe compte 4 joueurs titulaires et jusqu'à 4 remplaçants. Les 4 joueurs d'une partie doivent faire partie de la liste inscrite.",
    "Le pseudo et l'UID déclarés à l'inscription doivent correspondre au compte utilisé en jeu, sinon l'équipe est disqualifiée.",
    "Le code du salon privé est envoyé aux chefs de clan 15 minutes avant la première partie.",
    "Le classement additionne les points de placement et les points de kills de chaque partie, selon le barème du tournoi.",
    "En cas d'égalité, l'équipe avec le plus de points de placement passe devant, puis celle avec le plus de kills.",
    "Le chef de clan envoie une capture du tableau final de chaque partie à l'organisation.",
    "Logiciel tiers, émulateur non autorisé ou triche : disqualification immédiate de l'équipe."
  ];

  function iso(offset) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function player(i, j) { return { pseudo: CLANS[i][1] + " " + NAMES[(i * 3 + j * 9) % NAMES.length], uid: String(6728000000000000 + i * 104729 + j * 7919) }; }
  function mkTeam(tid, i, statut, chefId) {
    const joueurs = [0, 1, 2, 3].map(j => player(i, j));
    const remplacants = Array.from({ length: i % 3 }, (_, k) => player(i, 4 + k));
    return { id: tid + "-" + i, tournoiId: tid, nom: CLANS[i][0], tag: CLANS[i][1], chef: joueurs[0].pseudo, contact: "Discord : " + NAMES[(i * 3) % NAMES.length].toLowerCase() + "#" + (1000 + i * 37), joueurs, remplacants, statut, chefId: chefId || "c" + i, inscritLe: Date.now() - (i + 1) * 3600e3 };
  }
  function mkGames(tid, idx, n, seed) {
    const r = rng(seed); const games = [];
    for (let g = 0; g < n; g++) {
      const order = idx.slice().sort(() => r() - .5);
      games.push({ nom: "Partie " + (g + 1), lignes: order.map((i, p) => ({ teamId: tid + "-" + i, place: p + 1, kills: Math.max(0, Math.round((26 - p) / 3.2 + r() * 5 - 1.5)) })) });
    }
    return games;
  }
  function seed() {
    const all25 = Array.from({ length: 25 }, (_, i) => i);
    const base = () => ({ slots: 25, teamSize: 4, subs: 4, parties: 3, map: "Isolated", bareme: BAREME.slice(), killPts: 1, regles: RULES.slice() });
    const live = Object.assign(base(), { id: "t13", nom: "Scrim BR Hebdo #13", date: iso(0), heure: "20:00", prize: "10 000 CP + rôle Champion", description: "Scrim hebdomadaire Battle Royale en squad. 25 équipes, 3 parties, classement au cumul des points de placement et des kills.", statut: "en_cours", listePubliee: true, lives: [{ titre: "Live du scrim (exemple, remplace par ton lien)", url: "https://www.youtube.com/@CallofDutyMobile" }], resultats: { parties: mkGames("t13", all25, 1, 13), mvp: null, publie: false } });
    const cup = Object.assign(base(), { id: "cup2", nom: "BR Cup Saison 2", date: iso(14), heure: "18:00", prize: "50 000 FCFA", description: "La grande compétition Battle Royale de la saison. 25 squads, 3 parties sur Isolated. Les places sont attribuées dans l'ordre de validation.", statut: "inscriptions", listePubliee: false, bareme: [20, 14, 10, 8, 6, 5, 4, 3, 2, 1], killPts: 1, lives: [], resultats: { parties: [], mvp: null, publie: false } });
    const next = Object.assign(base(), { id: "t14", nom: "Scrim BR Hebdo #14", date: iso(7), heure: "20:00", prize: "10 000 CP + rôle Champion", description: "Scrim hebdomadaire Battle Royale en squad.", statut: "inscriptions", listePubliee: true, lives: [], resultats: { parties: [], mvp: null, publie: false } });
    const done = Object.assign(base(), { id: "t12", nom: "Scrim BR Hebdo #12", date: iso(-7), heure: "20:00", prize: "10 000 CP + rôle Champion", description: "Scrim hebdomadaire Battle Royale en squad.", statut: "termine", listePubliee: true, lives: [{ titre: "Rediffusion du scrim (exemple)", url: "https://www.youtube.com/@CallofDutyMobile" }], resultats: { parties: mkGames("t12", all25, 3, 12), mvp: null, publie: true } });
    const teams = [];
    all25.forEach(i => teams.push(mkTeam("t13", i, "validee", i === 0 ? "u-chef" : null)));
    all25.forEach(i => teams.push(mkTeam("t12", i, "validee", i === 0 ? "u-chef" : null)));
    for (let i = 1; i <= 18; i++) teams.push(mkTeam("cup2", i, "validee"));
    for (let i = 19; i <= 22; i++) teams.push(mkTeam("cup2", i, "en_attente"));
    for (let i = 5; i <= 13; i++) teams.push(mkTeam("t14", i, "validee"));
    // Un UID en double pour montrer l'alerte côté organisateur
    teams.find(x => x.id === "cup2-20").joueurs[3] = Object.assign({}, teams.find(x => x.id === "cup2-4").joueurs[1]);
    const S0 = { tournois: [live, next, cup, done], teams, users: [], session: null, nextId: 1 };
    const w = standings(done, S0.teams)[0], wt = S0.teams.find(x => x.id === w.teamId);
    done.resultats.mvp = { joueur: wt.joueurs[0].pseudo, teamId: wt.id, kills: Math.ceil(w.kills * .42) };
    const nrd = player(5, 0);
    S0.users = [
      { id: "u-joueur", pseudo: nrd.pseudo, uid: nrd.uid, role: "joueur", pass: "demo" },
      { id: "u-chef", pseudo: player(0, 0).pseudo, uid: player(0, 0).uid, role: "chef", clan: "Phantom Wolves", tag: "PWV", pass: "demo" },
      { id: "u-orga", pseudo: "Orga Gewgui", uid: "", role: "orga", pass: "demo" }
    ];
    return S0;
  }

  function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ } }

  let S = load() || seed();
  const ui = { view: "home", tid: null, tab: "equipes", day: null, gameTab: "all", showAll: false, playing: null, mtid: null, mtab: "inscriptions", mfilter: "en_attente", mgame: 0, signupType: "joueur", resetArmed: false };
  const app = document.getElementById("app");

  /* ---------- Utilitaires ---------- */
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function newId(p) { S.nextId = (S.nextId || 1) + 1; return p + Date.now().toString(36) + S.nextId; }
  function me() { return S.users.find(u => u.id === S.session) || null; }
  function role() { const u = me(); return u ? u.role : "invite"; }
  function T(id) { return S.tournois.find(t => t.id === id); }
  function teamById(id) { return S.teams.find(x => x.id === id); }
  function teamsOf(tid, st) { return S.teams.filter(x => x.tournoiId === tid && (!st || x.statut === st)); }
  function everyone(x) { return x.joueurs.concat(x.remplacants || []); }
  function dateObj(d) { return new Date(d + "T12:00:00"); }
  function fmtDate(d, opts) { try { return new Intl.DateTimeFormat("fr-FR", opts || { weekday: "short", day: "numeric", month: "short" }).format(dateObj(d)); } catch (e) { return d; } }
  function initials(n) { return String(n || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
  function pill(st) { const s = STATUTS[st] || STATUTS.termine; return '<span class="pill ' + s.cls + '">' + s.label + "</span>"; }
  function tpill(st) { const s = TEAM_STATUT[st]; return '<span class="pill ' + s[1] + '">' + s[0] + "</span>"; }
  function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
  function plural(n, w) { return n + " " + w + (n > 1 ? "s" : ""); }
  function ago(ts) { const h = Math.round((Date.now() - ts) / 3600e3); return h < 1 ? "à l'instant" : h < 24 ? "il y a " + h + " h" : "il y a " + Math.round(h / 24) + " j"; }
  function subsLabel(n) { return n ? "+ " + n + " rempl." : ""; }
  function standings(t, teams) {
    const rows = {};
    for (const p of t.resultats.parties) for (const l of p.lignes) {
      if (!l.place) continue;
      const r = rows[l.teamId] || (rows[l.teamId] = { teamId: l.teamId, pp: 0, kills: 0, games: 0, top1: 0, best: 999 });
      r.pp += t.bareme[l.place - 1] || 0; r.kills += Number(l.kills) || 0; r.games++; r.best = Math.min(r.best, l.place); if (l.place === 1) r.top1++;
    }
    return Object.values(rows).map(r => Object.assign(r, { total: r.pp + r.kills * (t.killPts || 0) }))
      .sort((a, b) => b.total - a.total || b.pp - a.pp || b.kills - a.kills || a.best - b.best);
  }
  function gameRows(t, g) {
    return t.resultats.parties[g].lignes.filter(l => l.place).map(l => ({ teamId: l.teamId, kills: l.kills, place: l.place, total: (t.bareme[l.place - 1] || 0) + l.kills * (t.killPts || 0) })).sort((a, b) => a.place - b.place);
  }
  function embedUrl(url) {
    try {
      const u = new URL(url); const h = u.hostname.replace(/^www\.|^m\./, "");
      if (h === "youtube.com" && u.searchParams.get("v")) return "https://www.youtube.com/embed/" + encodeURIComponent(u.searchParams.get("v"));
      if (h === "youtube.com" && /^\/(live|embed|shorts)\/[\w-]+/.test(u.pathname)) return "https://www.youtube.com/embed/" + u.pathname.split("/")[2];
      if (h === "youtu.be") return "https://www.youtube.com/embed/" + u.pathname.slice(1);
      if (h === "twitch.tv" && /^\/\w+$/.test(u.pathname)) return "https://player.twitch.tv/?channel=" + u.pathname.slice(1) + "&parent=" + location.hostname;
    } catch (e) { /* lien invalide */ }
    return null;
  }
  function platform(url) { try { const h = new URL(url).hostname; return /youtu/.test(h) ? "YouTube" : /twitch/.test(h) ? "Twitch" : /facebook|fb\./.test(h) ? "Facebook" : /tiktok/.test(h) ? "TikTok" : h.replace(/^www\./, ""); } catch (e) { return "Lien"; } }
  function activeCount(t) { return teamsOf(t.id).filter(x => x.statut !== "refusee").length; }
  function validCount(t) { return teamsOf(t.id, "validee").length; }
  function myTeam(t) { const u = me(); return u && teamsOf(t.id).find(x => x.chefId === u.id && x.statut !== "refusee"); }
  function dupUids(t) {
    const seen = {}, dup = new Set();
    teamsOf(t.id).filter(x => x.statut !== "refusee").forEach(x => everyone(x).forEach(p => { if (!p.uid) return; if (seen[p.uid]) dup.add(p.uid); seen[p.uid] = 1; }));
    return dup;
  }
  const ICON = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0V4zM8 21h8M12 17v4M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
    mine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"/></svg>',
    manage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
    profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    login: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
    trophy: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#ffc400" stroke-width="1.6" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0V4zM8 21h8M12 17v4M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
    play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#0b0b0c" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>'
  };

  /* ---------- Accueil ---------- */
  function headerHome() {
    const u = me();
    if (u) return '<div class="hello"><div><small>Salut,</small><b>' + esc(u.pseudo) + '</b></div><button class="av" data-go="profile" aria-label="Mon profil">' + esc(initials(u.pseudo)) + "</button></div>";
    return '<div class="hello"><span class="logo"><i>G</i>Gewgui</span><div class="row"><button class="btn" data-go="login">Connexion</button><button class="btn dark" data-go="signup">Créer un compte</button></div></div>';
  }
  function dateBlock(d) { const o = dateObj(d); return '<div class="date"><span>' + MONTHS[o.getMonth()] + "</span><b>" + String(o.getDate()).padStart(2, "0") + "</b></div>"; }
  function liveTicket(t) {
    const st = standings(t), lead = st[0] && teamById(st[0].teamId);
    const n = t.resultats.parties.length;
    return '<button class="tk live" data-open="' + t.id + '"><div class="top"><div class="row sp"><span class="pill live">En direct · Partie ' + Math.min(n + 1, t.parties) + "/" + t.parties + '</span><span class="small" style="font-weight:500">' + esc(t.map) + "</span></div>" +
      '<div class="big">' + esc(t.nom) + "</div>" +
      '<div class="mini"><div>En tête<b>' + (lead ? esc(lead.nom) : "—") + "</b></div><div>Points<b>" + (st[0] ? st[0].total : 0) + "</b></div><div>Équipes<b>" + validCount(t) + "</b></div></div></div>" +
      '<div class="cut"></div><div class="stub"><span style="font:600 .82rem Inter,sans-serif">' + validCount(t) * t.teamSize + " joueurs · Squad</span>" + '<span class="btn dark">' + (t.lives.length ? "▶ Regarder" : "Classement") + "</span></div></button>";
  }
  function listTicket(t) {
    const n = validCount(t), pct = Math.round(n / t.slots * 100);
    let side = '<span class="tag">' + plural(t.parties, "partie") + "</span>", foot;
    if (t.statut === "termine") {
      const w = standings(t)[0], wt = w && teamById(w.teamId);
      foot = t.resultats.publie && wt ? '<div class="row sp small"><span class="muted">Vainqueur</span><span style="font-weight:600">' + esc(wt.nom) + " · " + w.total + " pts</span></div>" : '<div class="small muted">Résultats bientôt publiés</div>';
    } else {
      foot = '<div class="gauge"><i style="width:' + pct + '%"></i></div><div class="muted" style="font-size:.72rem">' + n + " / " + t.slots + " équipes" + (t.statut === "inscriptions" ? " · " + plural(t.slots - activeCount(t), "place") : "") + "</div>";
    }
    const mine = myTeam(t);
    if (mine && t.statut !== "termine") side = '<span class="pill ' + TEAM_STATUT[mine.statut][1] + ' plain">Inscrit</span>';
    return '<button class="tk lst" data-open="' + t.id + '">' + dateBlock(t.date) + '<div class="inf"><div class="row sp" style="flex-wrap:nowrap"><h3>' + esc(t.nom) + "</h3>" + side + '</div><div class="small muted">' + esc(t.heure) + " · " + esc(t.prize) + "</div>" + foot + "</div></button>";
  }
  function viewHome() {
    const start = new Date(); start.setHours(12, 0, 0, 0); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    const dates = new Set(S.tournois.map(t => t.date)), todayIso = iso(0);
    let days = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      days += '<button class="day' + (dates.has(k) ? " has" : "") + (k === todayIso ? " today" : "") + '" data-day="' + k + '" aria-pressed="' + (ui.day === k) + '" aria-label="' + fmtDate(k, { weekday: "long", day: "numeric", month: "long" }) + '">' + "LMMJVSD"[i] + "<b>" + d.getDate() + "</b></button>";
    }
    const pool = S.tournois.filter(t => !ui.day || t.date === ui.day);
    const lives = pool.filter(t => t.statut === "en_cours");

      '<div class="tk sheet"><div class="facts"><div><b>' + fmtDate(t.date, { day: "numeric", month: "short" }) + "</b><span>" + esc(t.heure) + "</span></div><div><b>Squad</b><span>" + t.teamSize + " joueurs " + subsLabel(t.subs) + "</span></div><div><b>" + plural(t.parties, "partie") + "</b><span>" + esc(t.map) + '</span></div></div><div class="cut"></div><div class="stub"><div class="kv"><small>Récompense</small><b>' + esc(t.prize) + '</b></div><div class="kv" style="text-align:right"><small>' + (t.statut === "inscriptions" ? "Places" : "Lobby") + "</small><b>" + (t.statut === "inscriptions" ? plural(t.slots - activeCount(t), "restante") : n + " équipes") + "</b></div></div></div>" +

  function readRoster(fd, t) {
    const g = k => String(fd.get(k) || "").trim(), joueurs = [], remplacants = [];
    for (let i = 0; i < t.teamSize; i++) joueurs.push({ pseudo: g("j-pseudo-" + i), uid: g("j-uid-" + i) });
    for (let i = 0; i < t.subs; i++) { const p = g("r-pseudo-" + i), u = g("r-uid-" + i); if (p || u) remplacants.push({ pseudo: p, uid: u }); }
    return { joueurs, remplacants };
  }
  function checkRegister(form) {
    const t = T(ui.tid); if (!t) return false;
    const fd = new FormData(form), { joueurs, remplacants } = readRoster(fd, t);
    let msg = "";
    joueurs.forEach((p, i) => { if (msg) return; if (!p.pseudo) msg = "Il manque le pseudo du joueur " + (i + 1) + "."; else if (!/^\d{6,20}$/.test(p.uid)) msg = "UID du joueur " + (i + 1) + " : 6 à 20 chiffres."; });
    remplacants.forEach((p, i) => { if (msg) return; if (!p.pseudo) msg = "Il manque le pseudo du remplaçant " + (i + 1) + "."; else if (!/^\d{6,20}$/.test(p.uid)) msg = "UID du remplaçant " + (i + 1) + " : 6 à 20 chiffres."; });
    const uids = joueurs.concat(remplacants).map(p => p.uid);
    if (!msg && new Set(uids).size !== uids.length) msg = "Deux joueurs ont le même UID.";
    const taken = new Set(); teamsOf(t.id).filter(x => x.statut !== "refusee").forEach(x => everyone(x).forEach(p => taken.add(p.uid)));
    if (!msg && uids.some(u => taken.has(u))) msg = "Un de ces UID est déjà inscrit dans une autre équipe.";
    if (!msg && !String(fd.get("contact") || "").trim()) msg = "Ajoute un contact pour recevoir le code du salon.";
    if (!msg && !fd.get("rules")) msg = "Coche le règlement pour continuer.";
    form.querySelector("#r-submit").disabled = !!msg;
    form.querySelector("#r-hint").textContent = msg;
    return !msg;
  }
  function viewMine() {
    const u = me();

    const hist = regs.filter(o => o.t.statut === "termine").sort((a, b) => b.t.date.localeCompare(a.t.date));
    let html = '<div class="hello"><h1 class="title">Mon clan</h1><span class="tag" style="font-size:.8rem">' + esc(u.tag) + "</span></div>";
    html += '<div class="sec"><h2>' + esc(u.clan) + "</h2><span>Chef : " + esc(u.pseudo) + "</span></div>";
    if (!active.length) html += '<div class="empty"><h3>Aucune inscription en cours</h3><p>Choisis un tournoi aux inscriptions ouvertes pour inscrire ton squad.</p><button class="btn dark" data-go="home">Voir les tournois</button></div>';

    const fd = new FormData(f), g = k => String(fd.get(k) || "").trim(), kind = f.dataset.form;
    if (kind === "login") {
      const u = S.users.find(x => x.pseudo.toLowerCase() === g("pseudo").toLowerCase() && x.pass === g("pass"));
      if (!u) return toast("Pseudo ou mot de passe incorrect.");
      signIn(u);
    } else if (kind === "signup") {
      if (S.users.some(x => x.pseudo.toLowerCase() === g("pseudo").toLowerCase())) return toast("Ce pseudo a déjà un compte. Connecte-toi.");
      const u = { id: newId("u"), pseudo: g("pseudo"), uid: g("uid"), role: ui.signupType, pass: g("pass") };
      if (u.role === "chef") { u.clan = g("clan"); u.tag = g("tag").toUpperCase(); }
      S.users.push(u); signIn(u);
    } else if (kind === "register") {
      if (!checkRegister(f)) return;
      const t = T(ui.tid), u = me(), roster = readRoster(fd, t);
      S.teams.push({ id: newId("x"), tournoiId: t.id, nom: u.clan, tag: u.tag, chef: u.pseudo, contact: g("contact"), joueurs: roster.joueurs, remplacants: roster.remplacants, statut: "en_attente", chefId: u.id, inscritLe: Date.now() });
      save(); go("mine"); toast("Inscription envoyée. L'organisateur va la valider.");
    } else if (kind === "game") {
      if (!checkGame(f)) return;
      const t = T(ui.mtid), val = teamsOf(t.id, "validee");
      const lignes = val.map(x => ({ teamId: x.id, place: Number(g("p-" + x.id)) || 0, kills: Number(g("k-" + x.id)) || 0 }));
      const game = { nom: "Partie " + (ui.mgame + 1), lignes };
      if (t.resultats.parties[ui.mgame]) t.resultats.parties[ui.mgame] = game; else t.resultats.parties.push(game);
      if (t.statut !== "termine") t.statut = "en_cours";
      const done = ui.mgame + 1; if (ui.mgame < t.parties - 1) ui.mgame++;
      save(); render(); toast("Partie " + done + " enregistrée · classement mis à jour");
    } else if (kind === "mvp") {
      T(ui.mtid).resultats.mvp = { joueur: g("joueur"), teamId: g("teamId"), kills: Number(g("kills")) || 0 }; save(); render(); toast("MVP enregistré");
    } else if (kind === "live") {
      T(ui.mtid).lives.push({ titre: g("titre"), url: g("url") }); save(); render(); toast("Live ajouté");
    } else if (kind === "regles") {
      T(ui.mtid).regles = g("regles").split("\n").map(s => s.trim()).filter(Boolean); save(); render(); toast("Règlement enregistré");
    } else if (kind === "infos" || kind === "create") {
      const bareme = []; f.querySelectorAll('input[name^="b-"]').forEach(i => bareme.push(Math.max(0, Number(i.value) || 0)));
      while (bareme.length && !bareme[bareme.length - 1]) bareme.pop();
      const data = { nom: g("nom"), date: g("date"), heure: g("heure"), map: g("map"), parties: Number(g("parties")) || 1, slots: Math.min(25, Number(g("slots")) || 25), teamSize: 4, subs: Math.min(4, Number(g("subs")) || 0), prize: g("prize") || "À annoncer", bareme, killPts: Number(g("killPts")) || 0, description: g("description") };
      if (kind === "create") {
        const t = Object.assign({ id: newId("t"), statut: "inscriptions", listePubliee: false, regles: RULES.slice(), lives: [], resultats: { parties: [], mvp: null, publie: false } }, data);
        S.tournois.unshift(t); ui.mtid = t.id; ui.mtab = "inscriptions"; ui.mgame = 0; save(); go("manage"); toast("Tournoi créé · inscriptions ouvertes");
      } else { Object.assign(T(ui.mtid), data); save(); render(); toast("Tournoi enregistré · classement recalculé"); }
    }
  });

  render();
})();
</script>
</body>
</html>
